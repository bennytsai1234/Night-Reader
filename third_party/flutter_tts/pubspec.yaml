name: flutter_tts
description: Text to Speech plugin for Night Reader on Android.
version: 4.2.5+nightreader.2
publish_to: none

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.eyedeadevelopment.fluttertts
        pluginClass: FlutterTtsPlugin

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=1.22.0"
