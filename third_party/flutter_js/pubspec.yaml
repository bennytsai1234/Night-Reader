name: flutter_js
description: QuickJS engine for Night Reader on Android, driven over Dart FFI.
version: 0.8.7+nightreader.2
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"
dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.0.0
  http: ^1.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.abner.flutter_js
        pluginClass: FlutterJsPlugin

  assets:
    - assets/js/
