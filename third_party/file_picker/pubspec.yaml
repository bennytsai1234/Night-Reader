name: file_picker
description: Native Android file picker for Night Reader, with extension filtering support.
version: 11.0.3+nightreader.2
publish_to: none

dependencies:
  flutter:
    sdk: flutter

  flutter_plugin_android_lifecycle: ^2.0.22
  plugin_platform_interface: ^2.1.8
  path: ^1.9.0
  cross_file: ^0.3.4+2

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

flutter:
  plugin:
    platforms:
      android:
        package: com.mr.flutter.plugin.filepicker
        pluginClass: FilePickerPlugin
