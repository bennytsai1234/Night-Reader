name: Reader direct-flow cleanup

on:
  push:
    branches:
      - reader-direct-flow

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: reader-direct-flow

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Apply cleanup
        run: python3 tool/reader_direct_flow_cleanup.py

      - name: Format
        run: |
          dart format \
            lib/features/reader_v2/hybrid/hybrid_reader_screen.dart \
            lib/features/reader_v2/hybrid/view/admission_controller.dart \
            lib/features/reader_v2/hybrid/paragraph/paragraph_cache.dart \
            test/features/reader_v2/hybrid/hybrid_pump_test.dart

      - name: Commit cleanup
        run: |
          git config user.name "reader-refactor-bot"
          git config user.email "reader-refactor-bot@users.noreply.github.com"
          git add lib test/features/reader_v2/hybrid/hybrid_pump_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "refactor(reader): remove obsolete readiness contracts"
            git push origin HEAD:reader-direct-flow
          fi
