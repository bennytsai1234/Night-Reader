name: Reader direct-flow validation

on:
  push:
    branches:
      - reader-direct-flow
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-direct-flow-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: reader-direct-flow

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Reader tests
        run: flutter test test/features/reader_v2 --reporter expanded
