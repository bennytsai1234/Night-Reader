name: Android Release

on:
  # 推上 beta 有 App 改動就發測試版；推上 main（只會快轉到 beta 上的提交）在 pubspec
  # 版號升到還沒發布的版本時發正式版（ADR 0002、0027）。
  push:
    branches:
      - beta
      - main
      - "internal-test/**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "beta：在 beta 上補發測試版（推上 beta 會自動發，這只用在自動那次沒發出去時）；test：只建置測試 APK，不發布"
        type: choice
        options:
          - beta
          - test
        default: beta

permissions:
  contents: write

# 發版一次跑一個、不取消：後到的那次等前一次打完 tag 才判斷，看得到前一次已經發出去的
# 改動，不會連發兩個內容相同的測試版。beta 與 main 共用一組：測試版的編號從正式版的 tag
# 往後算，main 正在發正式版時 beta 那次若同時判斷，會查到 Release 卻沒有 checkout 到
# 剛打的 tag。其他 ref 只建測試 APK，各自一組。
concurrency:
  group: android-release-${{ (github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/main') && 'publish' || github.ref }}
  cancel-in-progress: false
  # 預設同一組只留一個等待中的執行，新來的會取消它：連續合併兩次時，前一次的測試版
  # 會被取消、併進下一版。排成佇列依序執行，每次合併各發一版（ADR 0027）。
  queue: max

jobs:
  plan-release:
    name: Plan release
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      publish: ${{ steps.plan.outputs.publish }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      tag_name: ${{ steps.plan.outputs.tag_name }}
      notes_heading: ${{ steps.plan.outputs.notes_heading }}
      notes_base: ${{ steps.plan.outputs.notes_base }}
      target_sha: ${{ steps.plan.outputs.target_sha }}
      build_name: ${{ steps.plan.outputs.build_name }}
      build_number: ${{ steps.plan.outputs.build_number }}
      artifact_label: ${{ steps.plan.outputs.artifact_label }}
      mode: ${{ steps.plan.outputs.mode }}

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release intent
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail

          app_version="$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)"
          # build number 由 CI 決定（見下方 build_number），pubspec 只寫 X.Y.Z。
          if [[ ! "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::pubspec version must be X.Y.Z, got '$app_version'"
            exit 1
          fi
          stable_tag="v${app_version}"

          # 上一個發布（正式版或測試版的 tag）之後，有沒有改到會進 APK 的檔案；哪些算、標了
          # Release-Notes: none 的提交不算，都由 tool/changelog.sh 判斷，和更新說明的檢查同一套。
          # 看的是整段而不只是這次推送，所以發版失敗、之後只推了測試修正時也會補發。
          has_unreleased_app_changes() {
            local last_tag files
            last_tag="$(git describe --tags --abbrev=0 --first-parent --match 'v[0-9]*' "$GITHUB_SHA" 2>/dev/null)" || return 0
            # 在 if 條件裡呼叫時 set -e 不生效，失敗要自己結束，免得被當成沒有改動而略過發版。
            if ! files="$(sh tool/changelog.sh app-files "$last_tag" "$GITHUB_SHA")"; then
              echo "::error::無法判斷 $last_tag 之後有沒有 App 改動。"
              exit 1
            fi
            [[ -n "$files" ]]
          }

          # 這個 tag 的 Release 是否已發布。只有查不到（404）才算沒發布；權限、限流、連線錯誤
          # 直接失敗，免得被當成「還沒發布」而略過發版或重發。
          release_exists() {
            local err
            if err="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$1" --silent 2>&1)"; then
              return 0
            fi
            if [[ "$err" == *"HTTP 404"* ]]; then
              return 1
            fi
            echo "::error::查詢 Release $1 失敗：$err"
            exit 1
          }

          # 正式版 tag 只有 vX.Y.Z；測試版 vX.Y.Z-beta.N 不參與正式版的版號檢查。
          stable_tags() {
            git tag --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true
          }

          mode=""
          should_build=false
          publish=false
          prerelease=false
          tag_name="$stable_tag"
          target_sha="$GITHUB_SHA"
          build_name="$app_version"
          artifact_label="$stable_tag"

          manual_beta=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$CHANNEL" == "beta" ]]; then
            manual_beta=true
          fi
          # 測試版只從 beta 發。先擋掉，免得在 main、internal-test 分支或 tag 上被下面的條件
          # 接走（變成只建測試 APK，或走正式版發布）。
          if [[ "$manual_beta" == "true" && "$GITHUB_REF" != "refs/heads/beta" ]]; then
            echo "::error::測試版只從 beta 發布，請在 beta 上執行（目前是 $GITHUB_REF）。"
            exit 1
          fi

          # 推上 beta 時自動發測試版，沒有東西可發是常態（例如只改了文件），照常結束、不發版。
          # 手動補發時讓這種情況失敗並寫明原因，觸發的人才看得出為什麼沒有新版。
          nothing_to_publish() {
            if [[ "$manual_beta" == "true" ]]; then
              echo "::error::$1"
              exit 1
            fi
            echo "$1"
            mode=no-release
          }

          if [[ "$GITHUB_REF" == refs/heads/internal-test/* ||
                ( "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$manual_beta" != "true" ) ]]; then
            # internal-test branch 與 channel=test 的手動執行只做 signed APK 驗證，不發布。
            mode=manual-test
            should_build=true
            artifact_label="manual-${GITHUB_SHA::7}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # 保留既有 tag-driven release；tag 必須和 pubspec 版本一致。
            if [[ "$GITHUB_REF_NAME" != "$stable_tag" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $stable_tag"
              exit 1
            fi
            mode=tag
            should_build=true
            publish=true
            target_sha="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            # main 只快轉到 beta 上測過的提交（ADR 0027）。main 自己多出提交的話，兩條分支的
            # 提交數岔開，versionCode 就不再是測試版與正式版共用、只增不減的同一條序列。
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/beta; then
              echo "::error::main 只能快轉到 beta 上的提交（ADR 0027），$GITHUB_SHA 不在 beta 上。"
              exit 1
            fi
            if release_exists "$stable_tag"; then
              echo "Release $stable_tag already exists; main 只在版號升到還沒發布的版本時發正式版。"
              mode=no-release
            elif git show-ref --verify --quiet "refs/tags/$stable_tag"; then
              # 支援「tag 已建立但 Release 尚未完成」的恢復路徑。
              mode=recover-existing-tag
              should_build=true
              publish=true
              target_sha="$(git rev-list -n 1 "$stable_tag")"
            else
              # 快轉到把 pubspec 的 app version 升到尚未發布版本的提交，就發正式版；
              # 這個 workflow 是 tag / Release 的唯一發布 owner。
              latest_tag="$(stable_tags | sort -V | tail -n 1)"
              if [[ -n "$latest_tag" ]]; then
                highest="$(printf '%s\n%s\n' "$latest_tag" "$stable_tag" | sort -V | tail -n 1)"
                if [[ "$highest" != "$stable_tag" || "$latest_tag" == "$stable_tag" ]]; then
                  echo "::error::pubspec version $stable_tag must be newer than latest tag $latest_tag"
                  exit 1
                fi
              fi
              mode=version-push
              should_build=true
              publish=true
            fi
          elif [[ "$GITHUB_REF" != "refs/heads/beta" ]]; then
            echo "::error::Unsupported release ref: $GITHUB_REF"
            exit 1
          elif ! release_exists "$stable_tag"; then
            # 升版號的提交先進 beta，main 快轉過去後由 main 發正式版。測試版的編號從已發布的
            # 正式版往後算，所以正式版發出之前 beta 不發測試版。
            nothing_to_publish "pubspec 的 $stable_tag 還沒發布：把 main 快轉到這個升版號的提交就會發正式版，正式版發出後才能發測試版。"
          else
            # 測試版 v<下一個修訂號>-beta.<正式版之後的提交數>。
            commits="$(git rev-list --count "${stable_tag}..${GITHUB_SHA}")"
            IFS=. read -r major minor patch <<< "$app_version"
            beta_name="${major}.${minor}.$((patch + 1))-beta.${commits}"
            beta_tag="v${beta_name}"
            if release_exists "$beta_tag"; then
              nothing_to_publish "測試版 $beta_tag 已經發布過，beta 之後沒有新的提交。"
            elif git show-ref --verify --quiet "refs/tags/$beta_tag"; then
              # 上次推了 tag 但建立 Release 失敗：照那個 tag 補發。這個 tag 本身會被當成
              # 「上一個發布」，所以不再做下面的改動與更新說明檢查（打 tag 前已經檢查過）。
              mode=recover-beta
              target_sha="$(git rev-list -n 1 "$beta_tag")"
            elif [[ "$commits" == 0 ]] || ! has_unreleased_app_changes; then
              nothing_to_publish "上一個發布之後 beta 沒有改到 App 內容，沒有新的測試版可發。"
            else
              # 更新說明在發版這一刻檢查（ADR 0010）：上一個發布之後改到 App 內容，
              # 「未發布」就要跟著寫，且不是空的。自動發的時候也一樣擋，沒寫就讓這次執行失敗。
              last_tag="$(git describe --tags --abbrev=0 --first-parent --match 'v[0-9]*' "$GITHUB_SHA")"
              if ! sh tool/changelog.sh check "$last_tag" "$GITHUB_SHA"; then
                echo "::error::$last_tag 之後的 App 改動沒有寫進 CHANGELOG.md 的「未發布」，補上後再推一次 beta，或在 beta 上手動執行 channel=beta 補發。"
                exit 1
              fi
              mode=beta
            fi
            if [[ "$mode" == beta || "$mode" == recover-beta ]]; then
              build_name="$beta_name"
              tag_name="$beta_tag"
              artifact_label="$beta_tag"
              prerelease=true
              should_build=true
              publish=true
            fi
          fi

          # Release 說明取 CHANGELOG.md 的段落（ADR 0010）：正式版取「X.Y.Z」整段；測試版取「未發布」
          # 裡上一個發布（notes_base）還沒有的條列，App 更新時再把中間每一版接起來。
          # 先在這裡確認段落存在，免得建置完才在發布時失敗。
          notes_heading=""
          notes_base=""
          if [[ "$publish" == "true" ]]; then
            if [[ "$prerelease" == "true" ]]; then
              notes_heading="未發布"
              notes_base="$(git describe --tags --abbrev=0 --first-parent --match 'v[0-9]*' "${target_sha}^")"
            else
              notes_heading="$app_version"
            fi
            if ! notes="$(git show "$target_sha:CHANGELOG.md" | sh tool/changelog.sh section "$notes_heading" -)"; then
              echo "::error::CHANGELOG.md 找不到「## $notes_heading」段落。正式版的版號 commit 要把「## 未發布」改成「## $notes_heading」，並在上面留一個空的「## 未發布」。"
              exit 1
            fi
            # 測試版的說明可以是空的，App 會顯示「沒有附更新說明」；正式版一定要有說明。
            if [[ "$prerelease" != "true" && -z "$notes" ]]; then
              echo "::error::CHANGELOG.md 的「## $notes_heading」段落是空的，請寫上這個正式版的更新說明。"
              exit 1
            fi
          fi

          # Android versionCode 取發版那個提交的提交數：beta 與 main 都禁止強制推送、歷史不改寫，main 又只
          # 快轉到 beta 上的提交，兩邊是同一條歷史，提交數只增不減（ADR 0004、0027）。正式版與測試版共用
          # 同一條序列，裝了測試版也能直接更新到之後的正式版。
          build_number="$(git rev-list --count "$target_sha")"

          {
            echo "mode=$mode"
            echo "should_build=$should_build"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
            echo "tag_name=$tag_name"
            echo "notes_heading=$notes_heading"
            echo "notes_base=$notes_base"
            echo "target_sha=$target_sha"
            echo "build_name=$build_name"
            echo "build_number=$build_number"
            echo "artifact_label=$artifact_label"
          } >> "$GITHUB_OUTPUT"
          echo "Plan: $mode $tag_name (versionName $build_name, versionCode $build_number)"

  verify:
    needs: plan-release
    if: needs.plan-release.outputs.should_build == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan-release.outputs.target_sha }}

  build-release-apk:
    name: Build signed arm64-v8a release APK
    needs: [plan-release, verify]
    if: needs.plan-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan-release.outputs.target_sha }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Configure Gradle for CI
        run: |
          mkdir -p "$HOME/.gradle"
          printf '%s\n' 'org.gradle.vfs.watch=false' >> "$HOME/.gradle/gradle.properties"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Decode Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/inkpage-release.jks"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/inkpage-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_NAME: ${{ needs.plan-release.outputs.build_name }}
          BUILD_NUMBER: ${{ needs.plan-release.outputs.build_number }}
        run: >-
          flutter build apk
          --release
          --split-per-abi
          --target-platform android-arm64
          --build-name "$BUILD_NAME"
          --build-number "$BUILD_NUMBER"
          --analyze-size
          --code-size-directory build/size-analysis

      - name: Verify Workmanager uses AGP built-in Kotlin
        run: |
          built_in_output="build/workmanager_android/intermediates/built_in_kotlinc"
          test -d "$built_in_output"
          find "$built_in_output" -type f -name '*.class' -print -quit | grep -q .

      - name: Upload code size analysis
        uses: actions/upload-artifact@v7
        with:
          name: night-reader-code-size-${{ needs.plan-release.outputs.artifact_label }}
          path: build/size-analysis/
          if-no-files-found: error
          retention-days: 30

      - name: Verify release APK manifest
        run: |
          set -euo pipefail
          apk_path="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -s "$apk_path"
          manifest_path="$(find build/app/intermediates/merged_manifests/release -name AndroidManifest.xml | head -n 1)"
          test -n "$manifest_path"
          grep -q 'android.permission.INTERNET' "$manifest_path"

      - name: Publish GitHub release
        if: needs.plan-release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.plan-release.outputs.tag_name }}
          TARGET_SHA: ${{ needs.plan-release.outputs.target_sha }}
          PRERELEASE: ${{ needs.plan-release.outputs.prerelease }}
          NOTES_HEADING: ${{ needs.plan-release.outputs.notes_heading }}
          NOTES_BASE: ${{ needs.plan-release.outputs.notes_base }}
        run: |
          set -euo pipefail
          apk_path="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          asset_name="night-reader-${TAG_NAME}-arm64-v8a.apk"
          notes_path="$RUNNER_TEMP/release-notes.md"
          if [[ "$PRERELEASE" == "true" ]]; then
            sh tool/changelog.sh added "$NOTES_BASE" > "$notes_path"
          else
            sh tool/changelog.sh section "$NOTES_HEADING" > "$notes_path"
          fi

          # 測試版標成預發布版：不會成為 Latest，網站與只收正式版的 App 都看不到。
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args=(--prerelease)
          else
            release_args=(--latest)
          fi

          if ! git show-ref --verify --quiet "refs/tags/$TAG_NAME"; then
            git tag "$TAG_NAME" "$TARGET_SHA"
            git push origin "refs/tags/$TAG_NAME"
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$apk_path#$asset_name" --clobber
          else
            gh release create "$TAG_NAME" "$apk_path#$asset_name" \
              --title "$TAG_NAME" \
              --notes-file "$notes_path" \
              "${release_args[@]}"
          fi

      - name: Upload test APK artifact
        if: needs.plan-release.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: night-reader-test-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7

  # 未簽章的 iOS IPA（ADR 0003）：沒有 Apple 開發者帳號，使用者自行用 AltStore／Sideloadly
  # 簽章安裝。排在 APK 之後：發布時 Release 由 APK 那步建立，這裡只補上 IPA；iOS 建置失敗
  # 不影響已發出的 Android 版。
  build-ios-ipa:
    name: Build unsigned iOS IPA
    needs: [plan-release, build-release-apk]
    if: needs.plan-release.outputs.should_build == 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan-release.outputs.target_sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        env:
          BUILD_NAME: ${{ needs.plan-release.outputs.build_name }}
          BUILD_NUMBER: ${{ needs.plan-release.outputs.build_number }}
        run: >-
          flutter build ios
          --release
          --no-codesign
          --build-name "$BUILD_NAME"
          --build-number "$BUILD_NUMBER"

      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R build/ios/iphoneos/Runner.app "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry night-reader-unsigned.ipa Payload)
          test -s "$RUNNER_TEMP/ipa/night-reader-unsigned.ipa"

      - name: Attach IPA to GitHub release
        if: needs.plan-release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.plan-release.outputs.tag_name }}
        run: >-
          gh release upload "$TAG_NAME"
          "$RUNNER_TEMP/ipa/night-reader-unsigned.ipa#night-reader-${TAG_NAME}-ios-unsigned.ipa"
          --clobber

      - name: Upload test IPA artifact
        if: needs.plan-release.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: night-reader-test-ios-unsigned
          path: ${{ runner.temp }}/ipa/night-reader-unsigned.ipa
          retention-days: 7
