name: Android Release

on:
  pull_request:
    branches:
      - main
    paths:
      - pubspec.yaml
      - .github/workflows/android-release.yml
  push:
    branches:
      - main
      - "internal-test/**"
    paths:
      - pubspec.yaml
      - pubspec.lock
      - android/**
      - .github/workflows/android-release.yml
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan-release:
    name: Plan release
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      publish: ${{ steps.plan.outputs.publish }}
      tag_name: ${{ steps.plan.outputs.tag_name }}
      target_sha: ${{ steps.plan.outputs.target_sha }}
      artifact_label: ${{ steps.plan.outputs.artifact_label }}
      mode: ${{ steps.plan.outputs.mode }}

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release intent
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          raw_version="$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)"
          test -n "$raw_version"
          app_version="${raw_version%%+*}"
          tag_name="v${app_version}"

          emit() {
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
          }

          emit tag_name "$tag_name"

          # PR 只驗證 release metadata / workflow 本身可以執行，不 build、不發布。
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            emit should_build false
            emit publish false
            emit target_sha "$GITHUB_SHA"
            emit artifact_label "pr-check"
            emit mode pr-check
            exit 0
          fi

          # 手動執行與 internal-test branch 永遠只做 signed APK 驗證，不發布。
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_REF" == refs/heads/internal-test/* ]]; then
            emit should_build true
            emit publish false
            emit target_sha "$GITHUB_SHA"
            emit artifact_label "manual-${GITHUB_SHA::7}"
            emit mode manual-test
            exit 0
          fi

          # 保留既有 tag-driven release；tag 必須和 pubspec 版本一致。
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "$GITHUB_REF_NAME" != "$tag_name" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $tag_name"
              exit 1
            fi
            emit should_build true
            emit publish true
            emit target_sha "$(git rev-list -n 1 "$GITHUB_REF_NAME")"
            emit artifact_label "$GITHUB_REF_NAME"
            emit mode tag
            exit 0
          fi

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Unsupported release ref: $GITHUB_REF"
            exit 1
          fi

          # main 上只要把 pubspec 的 app version 升到尚未發布的版本，
          # 這個 workflow 就會成為 tag / Release 的唯一發布 owner。
          if gh release view "$tag_name" >/dev/null 2>&1; then
            echo "Release $tag_name already exists; nothing to publish."
            emit should_build false
            emit publish false
            emit target_sha "$GITHUB_SHA"
            emit artifact_label "$tag_name"
            emit mode already-released
            exit 0
          fi

          if git show-ref --verify --quiet "refs/tags/$tag_name"; then
            # 支援「tag 已建立但 Release 尚未完成」的恢復路徑。
            target_sha="$(git rev-list -n 1 "$tag_name")"
            emit should_build true
            emit publish true
            emit target_sha "$target_sha"
            emit artifact_label "$tag_name"
            emit mode recover-existing-tag
            exit 0
          fi

          latest_tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1 || true)"
          if [[ -n "$latest_tag" ]]; then
            highest="$(printf '%s\n%s\n' "$latest_tag" "$tag_name" | sort -V | tail -n 1)"
            if [[ "$highest" != "$tag_name" || "$latest_tag" == "$tag_name" ]]; then
              echo "::error::pubspec version $tag_name must be newer than latest tag $latest_tag"
              exit 1
            fi
          fi

          emit should_build true
          emit publish true
          emit target_sha "$GITHUB_SHA"
          emit artifact_label "$tag_name"
          emit mode version-push

  build-release-apk:
    name: Build signed arm64-v8a release APK
    needs: plan-release
    if: needs.plan-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan-release.outputs.target_sha }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Configure Gradle for CI
        run: |
          mkdir -p "$HOME/.gradle"
          printf '%s\n' 'org.gradle.vfs.watch=false' >> "$HOME/.gradle/gradle.properties"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run reviewed contract suite
        run: |
          flutter analyze \
            lib/features/reader_v2 \
            lib/core/engine \
            lib/core/network \
            lib/core/services/source_switch_service.dart \
            lib/core/services/source_switch_handoff.dart \
            lib/core/local_book
          flutter test \
            test/core/engine/source_compatibility_test.dart \
            test/core/engine/js/js_extensions_test.dart \
            test/core/network/post_redirect_test.dart \
            test/local_txt_test.dart \
            test/core/services/source_switch_service_test.dart \
            test/features/reader_v2/reader_v2_state_machine_test.dart \
            test/features/reader_v2/reader_v2_runtime_operation_test.dart \
            test/features/reader_v2/hybrid/hybrid_pump_test.dart
      - name: Decode Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/inkpage-release.jks"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/inkpage-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          flutter build apk
          --release
          --split-per-abi
          --target-platform android-arm64
          --analyze-size
          --code-size-directory build/size-analysis

      - name: Verify Workmanager uses AGP built-in Kotlin
        run: |
          built_in_output="build/workmanager_android/intermediates/built_in_kotlinc"
          test -d "$built_in_output"
          find "$built_in_output" -type f -name '*.class' -print -quit | grep -q .

      - name: Upload code size analysis
        uses: actions/upload-artifact@v7
        with:
          name: night-reader-code-size-${{ needs.plan-release.outputs.artifact_label }}
          path: build/size-analysis/
          if-no-files-found: error
          retention-days: 30

      - name: Verify release APK manifest
        run: |
          set -euo pipefail
          apk_path="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -s "$apk_path"
          manifest_path="$(find build/app/intermediates/merged_manifests/release -name AndroidManifest.xml | head -n 1)"
          test -n "$manifest_path"
          grep -q 'android.permission.INTERNET' "$manifest_path"

      - name: Publish GitHub release
        if: needs.plan-release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.plan-release.outputs.tag_name }}
          TARGET_SHA: ${{ needs.plan-release.outputs.target_sha }}
        run: |
          set -euo pipefail
          apk_path="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          asset_name="night-reader-${TAG_NAME}-arm64-v8a.apk"

          if ! git show-ref --verify --quiet "refs/tags/$TAG_NAME"; then
            git tag "$TAG_NAME" "$TARGET_SHA"
            git push origin "refs/tags/$TAG_NAME"
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$apk_path#$asset_name" --clobber
          else
            gh release create "$TAG_NAME" "$apk_path#$asset_name" \
              --title "$TAG_NAME" \
              --generate-notes
          fi

      - name: Upload test APK artifact
        if: needs.plan-release.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: night-reader-test-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7
