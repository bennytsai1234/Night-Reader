name: Reader V2
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reader-v2-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze committed source
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/reader-checks"
          flutter analyze 2>&1 | tee "$RUNNER_TEMP/reader-checks/analyze.txt"
      - name: Reader and source-switch tests
        run: |
          set -o pipefail
          flutter test test/features/reader_v2 test/core/services/source_switch_service_test.dart test/core/services/source_switch_progress_test.dart test/core/engine/reader/chinese_text_converter_length_test.dart --reporter expanded 2>&1 | tee "$RUNNER_TEMP/reader-checks/tests.txt"
      - name: Verify validation did not modify tracked source
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-checks
          path: ${{ runner.temp }}/reader-checks
          retention-days: 7
  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare device validation
        run: |
          mkdir -p "$RUNNER_TEMP/reader-android"
          cat > "$RUNNER_TEMP/run-reader-journey.sh" <<'SH'
          set -u
          export NIGHT_READER_SCREENSHOT_DIR="$RUNNER_TEMP/reader-android"
          flutter drive --debug --no-dds --driver=test_driver/integration_test.dart --target=integration_test/reader_journey_test.dart -d emulator-5554 > "$RUNNER_TEMP/reader-android/journey.txt" 2>&1
          status=$?
          adb -s emulator-5554 logcat -d > "$RUNNER_TEMP/reader-android/logcat.txt" 2>&1 || true
          if [ -f build/integration_response_data.json ]; then cp build/integration_response_data.json "$RUNNER_TEMP/reader-android/"; fi
          cat "$RUNNER_TEMP/reader-android/journey.txt"
          exit "$status"
          SH
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash "$RUNNER_TEMP/run-reader-journey.sh"
      - name: Verify validation did not modify tracked source
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-android
          path: ${{ runner.temp }}/reader-android
          retention-days: 7
