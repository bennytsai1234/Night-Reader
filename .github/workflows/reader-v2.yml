name: Reader
on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/features/reader_v2/**'
      - 'lib/core/engine/**'
      - 'lib/core/network/**'
      - 'lib/core/services/source_switch_*.dart'
      - 'lib/core/local_book/**'
      - 'test/**'
      - '.github/workflows/reader-v2.yml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze architecture roots
        run: |
          flutter analyze --no-pub \
            lib/features/reader_v2 \
            lib/core/engine \
            lib/core/network \
            lib/core/services/source_switch_service.dart \
            lib/core/services/source_switch_handoff.dart \
            lib/core/local_book
      - name: Run reviewed contract suite
        run: |
          flutter test \
            test/core/engine/source_compatibility_test.dart \
            test/core/engine/js/js_extensions_test.dart \
            test/core/network/post_redirect_test.dart \
            test/local_txt_test.dart \
            test/core/services/source_switch_service_test.dart \
            test/features/reader_v2/reader_v2_state_machine_test.dart \
            test/features/reader_v2/reader_v2_runtime_operation_test.dart \
            test/features/reader_v2/hybrid/hybrid_pump_test.dart \
            --reporter compact
      - name: Verify validation did not modify tracked source
        if: always()
        run: git diff --exit-code
