name: Reader
on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/features/reader_v2/**'
      - 'test/features/reader_v2/**'
      - 'integration_test/reader_*.dart'
      - 'test/core/services/source_switch_*.dart'
      - 'test/core/engine/reader/chinese_text_converter_length_test.dart'
      - '.github/workflows/reader-v2.yml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reader-v2-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze committed source
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/reader-checks"
          git rev-parse HEAD > "$RUNNER_TEMP/reader-checks/SOURCE.txt"
          flutter analyze 2>&1 | tee "$RUNNER_TEMP/reader-checks/analyze.txt"
      - name: Reader and source-switch tests
        run: |
          set -o pipefail
          flutter test test/features/reader_v2 test/core/services/source_switch_service_test.dart test/core/services/source_switch_progress_test.dart test/core/engine/reader/chinese_text_converter_length_test.dart --reporter expanded 2>&1 | tee "$RUNNER_TEMP/reader-checks/tests.txt"
      - name: Verify validation did not modify tracked source
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-checks
          path: ${{ runner.temp }}/reader-checks
          retention-days: 7
