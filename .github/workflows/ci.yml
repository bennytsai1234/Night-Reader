name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to verify
        type: string
        required: false

permissions:
  contents: read

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting
        # *.g.dart 由 build_runner 產生，格式不在這裡把關。
        run: git ls-files -z '*.dart' ':!:*.g.dart' | xargs -0 dart format --output=none --set-exit-if-changed
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --reporter compact
      - name: Verify validation did not modify tracked source
        if: always()
        run: git diff --exit-code
