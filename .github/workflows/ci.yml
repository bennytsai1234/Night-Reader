name: CI

on:
  # 每條分支都跑，結果也顯示在該分支的 PR 上，通過才合併（AGENTS.md「Git 流程」）。
  # 本機 pre-push 在 Windows 上跑，只有 Linux 會出的錯要靠這裡在進 beta 之前擋下。
  push:
    branches: ["**"]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to verify
        type: string
        required: false

permissions:
  contents: read

jobs:
  changelog:
    name: Release notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test changelog tool
        # 有沒有寫更新說明，在推上 beta 發測試版時才檢查（android-release.yml，ADR 0027）。
        run: sh tool/changelog_test.sh

  # 三種檢查分在不同的機器上同時跑，全套測試再切成幾份：原本同一台依序跑約
  # 6 分鐘（測試 3.6 分、重新產生 Drift 1.4 分、analyze 0.5 分），拆開後最久的
  # 一台約 2 分鐘。每台各自裝一次 Flutter（約 20 秒），公開 repo 不另計費。
  #
  # 每個 job 的 concurrency 群組各自帶上自己的名稱（測試再帶分片）：同一群組
  # 只能跑一個，共用一個群組會讓同一次的幾台互相排隊或取消。推分支直接觸發
  # 的，有新的一次就取消舊的：舊提交的結果已經沒有用，留著只會讓新的一次排在
  # 它後面。發版呼叫的（帶 ref）不取消：每次合併各發一版，發版前的驗證要跑完
  # （ADR 0027）。
  codegen:
    name: Drift code is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}-codegen
      cancel-in-progress: ${{ !inputs.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Regenerate Drift code
        # 提交的 *.g.dart 過時時，最後的 git diff 會擋下來。
        run: dart run build_runner build
      - name: Verify generated code matches the commit
        run: git diff --exit-code

  test:
    name: Test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # 一份失敗時其他份照樣跑完，一次看到所有失敗。
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}-test-${{ matrix.shard }}
      cancel-in-progress: ${{ !inputs.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run tests (shard ${{ matrix.shard }} of 4)
        # 測試用提交的 *.g.dart；過時與否由 codegen 那台檢查。
        run: flutter test --no-pub --reporter compact --total-shards 4 --shard-index $(( ${{ matrix.shard }} - 1 ))
      - name: Verify tests did not modify tracked source
        if: always()
        run: git diff --exit-code

  verify:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}-verify
      cancel-in-progress: ${{ !inputs.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Check Flutter version matches across workflows
        # ci.yml 與 android-release.yml 各自固定 Flutter 版本，升級時兩處要一起改。
        run: |
          versions=$(grep -ho "flutter-version: *['\"][^'\"]*['\"]" .github/workflows/*.yml | sed "s/.*['\"]\(.*\)['\"]/\1/" | sort -u)
          echo "Flutter versions pinned in workflows: $versions"
          if [ -z "$versions" ] || [ "$(printf '%s\n' "$versions" | wc -l)" -ne 1 ]; then
            echo "::error::Workflows pin different Flutter versions; update ci.yml and android-release.yml together."
            exit 1
          fi
      - name: Check ADR numbers are unique
        # 平行的分支各自新增 ADR 時可能取到同一個編號；檔名不同，Git 合併不會報衝突。
        # 檔名不是「四位數-標題.md」的先擋下，編號才比得準（五位數、少補零、備份檔）；
        # README.md 是索引，不是 ADR。
        run: |
          adrs=$(ls docs/adr | grep -v '^README\.md$' || true)
          misnamed=$(printf '%s\n' "$adrs" | grep -v '^[0-9]\{4\}-[^/]*\.md$' || true)
          if [ -n "$misnamed" ]; then
            echo "::error::ADR file names must be NNNN-title.md: $misnamed"
            exit 1
          fi
          duplicates=$(printf '%s\n' "$adrs" | cut -c1-4 | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "::error::Duplicate ADR numbers: $duplicates. Renumber the newer ADR and the links to it."
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting
        # *.g.dart 由 build_runner 產生，格式不在這裡把關。
        run: git ls-files -z '*.dart' ':!:*.g.dart' | xargs -0 dart format --output=none --set-exit-if-changed
      - run: flutter analyze --no-pub
      - name: Test frame budget compare tool
        run: sh tool/frame_budget_compare_test.sh
      - name: Verify validation did not modify tracked source
        if: always()
        run: git diff --exit-code
