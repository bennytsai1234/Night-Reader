name: CI

on:
  # 每條分支都跑：不走 PR 之後，合併前要在分支上看到 Linux 的結果（AGENTS.md「Git 流程」）。
  # 本機 pre-push 在 Windows 上跑，只有 Linux 會出的錯要靠這裡在進 main 之前擋下。
  push:
    branches: ["**"]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to verify
        type: string
        required: false

permissions:
  contents: read

jobs:
  changelog:
    name: Release notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test changelog tool
        run: sh tool/changelog_test.sh
      - name: Require release notes for app changes pushed to main
        # 和 .githooks/pre-push 同一個檢查，沒裝 hook 的推送也擋得到；
        # 這裡失敗時 Android Release 不會發版（ADR 0010）。
        # Android Release 以 workflow_call 呼叫時，github.event 仍是那次推送。
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ inputs.ref || github.sha }}
        run: sh tool/changelog.sh check "$BEFORE_SHA" "$HEAD_SHA"

  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Check Flutter version matches across workflows
        # ci.yml 與 android-release.yml 各自固定 Flutter 版本，升級時兩處要一起改。
        run: |
          versions=$(grep -ho "flutter-version: *['\"][^'\"]*['\"]" .github/workflows/*.yml | sed "s/.*['\"]\(.*\)['\"]/\1/" | sort -u)
          echo "Flutter versions pinned in workflows: $versions"
          if [ -z "$versions" ] || [ "$(printf '%s\n' "$versions" | wc -l)" -ne 1 ]; then
            echo "::error::Workflows pin different Flutter versions; update ci.yml and android-release.yml together."
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Regenerate Drift code
        # 提交的 *.g.dart 過時時，最後的 git diff 會擋下來。
        run: dart run build_runner build
      - name: Check formatting
        # *.g.dart 由 build_runner 產生，格式不在這裡把關。
        run: git ls-files -z '*.dart' ':!:*.g.dart' | xargs -0 dart format --output=none --set-exit-if-changed
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --reporter compact
      - name: Verify validation did not modify tracked source
        if: always()
        run: git diff --exit-code
