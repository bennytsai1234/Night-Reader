name: Reader V2 workbench
on:
  push:
    branches: [fix/reader-v2-ownership-20260917]
permissions:
  contents: read
concurrency:
  group: reader-v2-workbench
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Apply source edits with base verification
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, shutil
          from pathlib import Path
          payload = Path('.github/reader-v2-edits.b64')
          if not payload.exists():
              raise SystemExit('Source edit payload is not present yet')
          changes = json.loads(gzip.decompress(base64.b64decode(payload.read_text())))
          root = Path.cwd().resolve()
          for change in changes:
              path = Path(change['path'])
              path.resolve().relative_to(root)
              assert hashlib.sha256(path.read_bytes()).hexdigest() == change['sha256'], path
          for change in changes:
              path = Path(change['path'])
              if change.get('delete'):
                  backup = Path(os.environ['RUNNER_TEMP']) / 'reader-deleted' / path
                  backup.parent.mkdir(parents=True, exist_ok=True)
                  shutil.move(str(path), str(backup))
              else:
                  lines = path.read_text().splitlines(keepends=True)
                  for start, end, replacement in reversed(change['edits']):
                      lines[start:end] = [replacement]
                  path.write_text(''.join(lines))
          print(f'Applied {len(changes)} verified source edits')
          PY
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format changed Dart files
        run: |
          git diff --name-only --diff-filter=AM -- '*.dart' | xargs -r dart format
      - name: Analyze
        run: |
          mkdir -p "$RUNNER_TEMP/reader-output"
          flutter analyze 2>&1 | tee "$RUNNER_TEMP/reader-output/analyze.txt"
      - name: Reader and source-switch tests
        run: |
          flutter test test/features/reader_v2 test/core/services/source_switch_service_test.dart test/core/services/source_switch_progress_test.dart test/core/engine/reader/chinese_text_converter_length_test.dart --reporter expanded 2>&1 | tee "$RUNNER_TEMP/reader-output/tests.txt"
      - name: Collect applied changes
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/reader-output"
          git diff --check > "$RUNNER_TEMP/reader-output/diff-check.txt" || true
          git diff --stat > "$RUNNER_TEMP/reader-output/stat.txt"
          git diff --binary > "$RUNNER_TEMP/reader-output/applied.patch"
          python3 - <<'PY'
          import os, subprocess, tarfile
          from pathlib import Path
          paths = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=AM'], text=True).splitlines()
          with tarfile.open(Path(os.environ['RUNNER_TEMP']) / 'reader-output' / 'changed-files.tgz', 'w:gz') as archive:
              for path in paths:
                  archive.add(path, arcname=path)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-workbench-output
          path: ${{ runner.temp }}/reader-output
          retention-days: 3
