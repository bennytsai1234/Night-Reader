name: Reader V2 workbench
on:
  push:
    branches: [fix/reader-v2-ownership-20260917]
permissions:
  contents: read
concurrency:
  group: reader-v2-workbench
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze Reader
        run: flutter analyze lib/features/reader_v2 test/features/reader_v2 integration_test
      - name: Reader tests
        run: flutter test test/features/reader_v2 --reporter expanded
