name: Hybrid B reference checks
on:
  push:
    branches: [reader-hybrid-b-rebuild]
    paths: [.github/workflows/hybrid-b-toolchain.yml]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 6a4de1ab27e26ca56df1fc133c08d8bb988b54bc
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Reference Reader tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/reference-checks"
          flutter test test/features/reader_v2 --reporter expanded 2>&1 | tee "$RUNNER_TEMP/reference-checks/tests.txt"
      - name: Export native dependency and exact reference identity
        if: always()
        shell: bash
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/reference-checks"
          find .dart_tool -name libsqlite3.so -exec cp {} "$RUNNER_TEMP/reference-checks/libsqlite3.so" \;
          git rev-parse HEAD > "$RUNNER_TEMP/reference-checks/SOURCE.txt"
          git diff --exit-code
          cd "$RUNNER_TEMP/reference-checks"
          sha256sum libsqlite3.so > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-b-reference-checks
          path: ${{ runner.temp }}/reference-checks
          retention-days: 1
