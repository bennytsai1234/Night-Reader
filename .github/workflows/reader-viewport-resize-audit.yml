name: Reader viewport resize audit

on:
  push:
    branches:
      - audit/reader-resume-offset-chapter-gap
    paths:
      - test/features/reader_v2/reader_v2_viewport_resize_audit_test.dart
      - .github/workflows/reader-viewport-resize-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  viewport-resize-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run viewport resize audit
        run: flutter test test/features/reader_v2/reader_v2_viewport_resize_audit_test.dart
