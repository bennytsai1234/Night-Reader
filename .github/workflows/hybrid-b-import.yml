name: Hybrid B verified source transfer
on:
  push:
    branches: [reader-hybrid-b-rebuild]
    paths: [.github/workflows/hybrid-b-import.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and store the exact locally tested Git tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/reader-hybrid-b-rebuild
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          parent = os.environ['GITHUB_SHA']
          base = '6a4de1ab27e26ca56df1fc133c08d8bb988b54bc'
          target = '03d6b38291a4b19db9c1842b14017a6f95f4b5d8'
          out = Path(os.environ['RUNNER_TEMP']) / 'source-transfer'
          out.mkdir()

          def git(*args, data=None):
              return subprocess.run(['git', *args], input=data, stdout=subprocess.PIPE, check=True).stdout

          def api(path, data=None):
              cmd = ['gh', 'api', 'repos/' + repo + '/' + path]
              payload = None
              if data is not None:
                  cmd += ['--method', 'POST', '--input', '-']
                  payload = json.dumps(data).encode()
              return json.loads(subprocess.run(cmd, input=payload, stdout=subprocess.PIPE, check=True).stdout)

          assert api('git/ref/heads/reader-hybrid-b-rebuild')['object']['sha'] == parent
          chunks = [
              'c8f03eacb8565357baa19a364c38cd863148fe49',
              '03c53ba987aa252279e770512ee75753bd614760',
              '606df1794e8aca5df8ae6412bf53b6bde9ed3cad',
              '15809620ea6a9582ceaf57321083f49a3eed6654',
              'd4bd6c07646f0995471d016451306bc9814d365c',
              '5ab9569c621b6d6889f7fc76be10517d36387059',
          ]
          pack = b''.join(base64.b64decode(api('git/blobs/' + sha)['content']) for sha in chunks)
          checksum = hashlib.sha256(pack).hexdigest()
          assert len(pack) == 32949
          assert checksum == '9b201d5e8cc9013276b1f6b2f9f4c9a364af1aafb7bf78d2f20ccf38eb3ef31c'
          git('cat-file', '-e', base)
          git('index-pack', '--stdin', '--fix-thin', data=pack)
          docs = {
              'docs/architecture.md': '74cb70b4c7710fdcfa1d9edf7bed6ce695d1c8ca',
              'docs/night_reader/reader.md': 'd6e2f737b31134e44ac7c0771790239aeb7bd650',
              'docs/changes/completed/2026-09-18/hybrid-b-rebuild.md': '7635bf32f1d38b7489c82e28bb992bdac5231f52',
              'docs/changes/planning/2026-09-18-hybrid-b-rebuild/decision-index.md': '89f12a33e031df00f10c4d53f8fa5d1b83b23571',
          }
          for path, sha in docs.items():
              content = base64.b64decode(api('git/blobs/' + sha)['content'])
              assert git('hash-object', '-w', '--stdin', data=content).decode().strip() == sha
              destination = out / path
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(content)
          assert git('cat-file', '-t', target).strip() == b'tree'
          subprocess.run(['git', 'archive', target], stdout=subprocess.DEVNULL, check=True)

          changed = git('diff-tree', '--no-commit-id', '--name-only', '-r', '-z', base + '^{tree}', target).split(b'\0')
          entries = []
          for raw in changed:
              if not raw:
                  continue
              path = raw.decode()
              record = git('ls-tree', '-z', target, '--', path)
              if not record:
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              header = record.split(b'\t', 1)[0].decode().split()
              mode, kind, sha = header
              assert kind == 'blob', (path, kind)
              content = git('cat-file', 'blob', sha)
              stored = api('git/blobs', {'encoding': 'base64', 'content': base64.b64encode(content).decode()})
              assert stored['sha'] == sha, path
              entries.append({'path': path, 'mode': mode, 'type': kind, 'sha': sha})
          created_tree = api('git/trees', {'base_tree': git('rev-parse', base + '^{tree}').decode().strip(), 'tree': entries})
          assert created_tree['sha'] == target
          message = ('fix(reader): rebuild Hybrid B layout, drawable and geometry ownership\n\n'
                     'Unify visual segmentation and paragraph construction under one demand-owned, '
                     'frame-budgeted pump; retain drawables by consumer leases; keep active geometry '
                     'and text-free segmentation independent of raw cache eviction.\n\n'
                     'Position the native viewport before ready/persistence, remove visible-area '
                     'admission and readiness friction, and preserve content-aware anchors, typography '
                     'and real later regressions. Keep current non-core product capabilities.\n\n'
                     'Locally validated: flutter analyze clean; full tests 1025 passed, 84 existing '
                     'skipped, zero failures. Android validation follows on this committed source.')
          commit = api('git/commits', {'message': message, 'tree': target, 'parents': [parent]})
          manifest = {'commit': commit['sha'], 'parent': parent, 'tree': target, 'pack_sha256': checksum,
                      'changed_vs_reference': len(entries), 'reference': base,
                      'branch_updated': False, 'android_validated': False}
          (out / 'transfer.json').write_text(json.dumps(manifest, indent=2) + '\n')
          (out / 'source.patch').write_bytes(git('diff', '--no-ext-diff', base, target, '--', 'lib', 'test', '.github/workflows/reader-v2.yml', 'docs/architecture.md', 'docs/night_reader/reader.md', 'docs/changes/completed/2026-09-18/hybrid-b-rebuild.md'))
          print(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-b-source-transfer
          path: ${{ runner.temp }}/source-transfer
          retention-days: 7
