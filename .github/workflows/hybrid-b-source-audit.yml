name: Hybrid B source audit
on:
  push:
    branches: [reader-hybrid-b-rebuild]
    paths: [.github/workflows/hybrid-b-source-audit.yml]
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 6a4de1ab27e26ca56df1fc133c08d8bb988b54bc
          fetch-depth: 0
          persist-credentials: false
      - name: Export immutable source history without running repository code
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "6a4de1ab27e26ca56df1fc133c08d8bb988b54bc"
          mkdir -p "$RUNNER_TEMP/hybrid-b-audit"
          git bundle create "$RUNNER_TEMP/hybrid-b-audit/history.bundle" HEAD --tags
          git bundle verify "$RUNNER_TEMP/hybrid-b-audit/history.bundle"
          git show -s --format=fuller HEAD > "$RUNNER_TEMP/hybrid-b-audit/HEAD.txt"
          git diff --exit-code
          cd "$RUNNER_TEMP/hybrid-b-audit"
          sha256sum history.bundle > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-b-immutable-history
          path: ${{ runner.temp }}/hybrid-b-audit
          retention-days: 1
