flutter_native_splash:
  # 一段式啟動畫面：原生 splash 為主題色純色底（與書架 scaffold 背景一致，硬切交棒
  # 無跳色），由 main.dart 的 FlutterNativeSplash.preserve() 延後首幀，撐到書架首批
  # 書載完才放行（見 features/welcome/main_page.dart）。全程只有這一層原生畫面，
  # 沒有 Flutter 端轉場圖。
  color: "#F4EFE3"       # 亮主題 scaffold 背景（AppPalette.paper200）
  color_dark: "#1A1612"  # 暗主題 scaffold 背景（AppPalette.ink600）

  android: true
  ios: false
  web: false

  # Android 12+ 系統啟動畫面：純色底 + 置中靜態圖示（不做動畫；部分 ROM 會吃掉
  # AVD 動畫只畫靜態幀，故一律用靜態圖示求全機型一致）。圖示不是本套件生成，而是
  # 各密度的 @drawable/splash_icon PNG（drawable-mdpi～xxxhdpi，288dp 透明底，內容
  # 收在中央 2/3 圓形安全區），亮暗主題共用同一張。
  # 注意：重跑 `dart run flutter_native_splash:create` 會覆寫 values-v31 與
  # values-night-v31 的 styles.xml，之後需手動把下面這行加回兩份 LaunchTheme：
  #   <item name="android:windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>
  android_12:
    color: "#F4EFE3"
    color_dark: "#1A1612"
