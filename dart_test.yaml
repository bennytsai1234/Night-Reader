tags:
  # 整個 App 的截圖（test/screens/），要看畫面時才跑：
  # flutter test --run-skipped -t screens test/screens
  screens:
    skip: "截圖用，平常不跑"
  # 動畫期間每一幀的成本（test/frame_budget/），要量時才跑：
  # flutter test --run-skipped -t frame_budget test/frame_budget
  frame_budget:
    skip: "量測用，平常不跑"
  # 整個 App 一區一區錄成動畫儀表板（test/animation_survey/），要錄時才跑：
  # bash tool/animation_survey/run_all.sh [區 ...]
  animation_survey:
    skip: "錄影用，平常不跑"
  # 細節檢查（test/polish/）要系統的中文字型，CI 另開一台照 POLISH_GATE=1 跑（ci.yml）。
  # 本機淺色、深色都跑：
  # flutter test --run-skipped -t polish test/polish
  polish:
    skip: "要中文字型，CI 另開一台跑"
  # 用真的網站校驗書源（test/live/），用法寫在檔頭：
  # NR_SOURCES=<書源 JSON> flutter test --run-skipped -t live test/live
  live:
    skip: "連真的網站，要查書源時才跑"
